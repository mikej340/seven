<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" role="img" aria-labelledby="title desc">
  <title id="title">Seven-letter and longer flower</title>
  <desc id="desc">A large burgundy six-petal flower on a tall green stem.</desc>
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d3b59"/>
      <stop offset="1" stop-color="#642039"/>
    </linearGradient>
    <filter id="soft-shadow" x="-35%" y="-35%" width="170%" height="175%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="1.6" flood-color="#38242c" flood-opacity=".25"/>
    </filter>
  </defs>
  <path d="M60 166 C59 129 61 88 60 52" fill="none" stroke="#5f7246" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M60 124 C50 111 40 112 35 118 C42 131 51 134 60 131Z" fill="#788b56"/>
  <g transform="translate(60 48)">
    <ellipse rx="10.5" ry="20" transform="rotate(0) translate(0 -15)" fill="url(#petal)"/>
    <ellipse rx="10.5" ry="20" transform="rotate(60) translate(0 -15)" fill="url(#petal)"/>
    <ellipse rx="10.5" ry="20" transform="rotate(120) translate(0 -15)" fill="url(#petal)"/>
    <ellipse rx="10.5" ry="20" transform="rotate(180) translate(0 -15)" fill="url(#petal)"/>
    <ellipse rx="10.5" ry="20" transform="rotate(240) translate(0 -15)" fill="url(#petal)"/>
    <ellipse rx="10.5" ry="20" transform="rotate(300) translate(0 -15)" fill="url(#petal)"/>
    <circle r="10" fill="#532035"/>
    <circle cy="-2" r="3.5" fill="#c88b58" opacity=".82"/>
  </g>
</svg>
