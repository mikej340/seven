<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" role="img" aria-labelledby="title desc">
  <title id="title">Six-letter flower</title>
  <desc id="desc">A simple open terracotta flower on a medium green stem.</desc>
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cf7b55"/>
      <stop offset="1" stop-color="#a94f38"/>
    </linearGradient>
    <filter id="soft-shadow" x="-35%" y="-35%" width="170%" height="175%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#3c462f" flood-opacity=".22"/>
    </filter>
  </defs>
  <path d="M60 166 C61 139 59 109 60 78" fill="none" stroke="#65784b" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M60 132 C69 122 78 123 83 128 C77 138 69 141 60 138Z" fill="#7f915c"/>
  <g transform="translate(60 70)">
    <ellipse rx="9" ry="17" transform="rotate(0) translate(0 -13)" fill="url(#petal)"/>
    <ellipse rx="9" ry="17" transform="rotate(72) translate(0 -13)" fill="url(#petal)"/>
    <ellipse rx="9" ry="17" transform="rotate(144) translate(0 -13)" fill="url(#petal)"/>
    <ellipse rx="9" ry="17" transform="rotate(216) translate(0 -13)" fill="url(#petal)"/>
    <ellipse rx="9" ry="17" transform="rotate(288) translate(0 -13)" fill="url(#petal)"/>
    <circle r="8" fill="#81442f"/>
    <circle cy="-2" r="3" fill="#d29a53" opacity=".75"/>
  </g>
</svg>
