    <ellipse rx="9.5" ry="22" transform="rotate(45) translate(0 -17)" fill="url(#gold)"/>
    <ellipse rx="9.5" ry="22" transform="rotate(90) translate(0 -17)" fill="url(#gold)"/>
    <ellipse rx="9.5" ry="22" transform="rotate(135) translate(0 -17)" fill="url(#gold)"/>
    <ellipse rx="9.5" ry="22" transform="rotate(180) translate(0 -17)" fill="url(#gold)"/>
    <ellipse rx="9.5" ry="22" transform="rotate(225) translate(0 -17)" fill="url(#gold)"/>
    <ellipse rx="9.5" ry="22" transform="rotate(270) translate(0 -17)" fill="url(#gold)"/>
    <ellipse rx="9.5" ry="22" transform="rotate(315) translate(0 -17)" fill="url(#gold)"/>
    <circle r="14" fill="#752a47"/>
    <circle r="8" fill="#8c3a50"/>
    <circle cx="-3" cy="-4" r="3" fill="#f2d26b" opacity=".8"/>
  </g>
